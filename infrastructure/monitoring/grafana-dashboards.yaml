apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  baas.json: |
    {
      "title": "BaaS System Monitor",
      "panels": [
        {
          "type": "timeseries",
          "title": "Block Height (Chiều cao khối)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [ { "expr": "chain_head_block", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Connected Peers (Số kết nối P2P)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [ { "expr": "p2p_peers", "refId": "A" } ]
        }
      ]
    }
