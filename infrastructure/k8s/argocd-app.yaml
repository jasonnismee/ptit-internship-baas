apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baas-orchestrator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hhoan/ptit-internship-baas.git' # Đổi thành URL git thật nếu cần
    targetRevision: HEAD
    path: infrastructure/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
