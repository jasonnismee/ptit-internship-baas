apiVersion: apps/v1
kind: Deployment
metadata:
  name: baas-backend-deployment
  labels:
    app: baas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baas-backend
  template:
    metadata:
      labels:
        app: baas-backend
    spec:
      serviceAccountName: baas-backend-sa # Lấy quyền admin
      containers:
      - name: backend
        # Sửa thành YOUR_USERNAME trên DockerHub của bạn
        image: <YOUR_DOCKER_USERNAME>/ptit-baas-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: baas-backend-service
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
  selector:
    app: baas-backend
