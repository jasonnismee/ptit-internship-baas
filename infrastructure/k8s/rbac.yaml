# Cấp quyền (RBAC) cho Backend FastAPI gọi lệnh tạo Mạng Blockchain
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baas-backend-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baas-backend-role
rules:
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "pods", "pods/exec"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baas-backend-role-binding
subjects:
- kind: ServiceAccount
  name: baas-backend-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: baas-backend-role
  apiGroup: rbac.authorization.k8s.io
