apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
  labels:
    app: geth
spec:
  serviceName: "geth-headless"
  replicas: 3
  selector:
    matchLabels:
      app: geth
  template:
    metadata:
      labels:
        app: geth
    spec:
      containers:
      # --- MAIN CONTAINER ---
      - name: geth
        image: ethereum/client-go:v1.13.5
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 1. Lấy IP động của Pod hiện tại
            POD_IP=$(hostname -i)
            echo "Starting Geth at IP: $POD_IP"

            # 2. Chạy Geth với biến môi trường $POD_IP
            geth --datadir /data \
            --networkid 12345 \
            --http --http.addr "0.0.0.0" --http.api "eth,net,web3,personal,admin,miner" \
            --mine --miner.etherbase 0xe660105C765DE27a9095c1589368F4DEDaf1f9C4 \
            --unlock 0xe660105C765DE27a9095c1589368F4DEDaf1f9C4 \
            --password /etc/geth-pass/password \
            --allow-insecure-unlock \
            --nodiscover \
            --nat extip:$POD_IP
        
        ports:
        - containerPort: 8545
        - containerPort: 30303
        volumeMounts:
        - name: data
          mountPath: /data
        - name: password-secret
          mountPath: /etc/geth-pass
          readOnly: true

      # --- INIT CONTAINERS ---
      initContainers:
      - name: init-genesis
        image: ethereum/client-go:v1.13.5
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -d /data/geth ]; then
              echo "Initializing Genesis..."
              geth init --datadir /data /config/genesis.json
            fi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: genesis-config
          mountPath: /config

      - name: import-account
        image: ethereum/client-go:v1.13.5
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Importing Private Key..."
            # Xóa keystore cũ
            rm -rf /data/keystore
            # Import password
            geth account import --datadir /data --password /etc/geth-pass/password /etc/secret/key
        volumeMounts:
        - name: data
          mountPath: /data
        - name: account-secret
          mountPath: /etc/secret
          readOnly: true
        - name: password-secret
          mountPath: /etc/geth-pass
          readOnly: true

      volumes:
      - name: genesis-config
        configMap:
          name: geth-genesis
      - name: account-secret
        secret:
          secretName: geth-account-key
      - name: password-secret
        secret:
          secretName: geth-pass

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi